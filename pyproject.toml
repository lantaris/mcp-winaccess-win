[project]
name = "mcp-winaccess-win"
version = "1.5.0"
description = "Windows-only desktop automation MCP server (ctypes + UI Automation, no pyautogui/pywinauto)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "Pillow>=11.2.1",
    "comtypes>=1.4.0",
    "pytesseract>=0.3.10",
]
keywords = ["mcp", "windows", "automation", "uiautomation", "ctypes", "desktop"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "mcp-winaccess-win[vision]",
]

[project.scripts]
mcp-winaccess-win = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "adapter"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
